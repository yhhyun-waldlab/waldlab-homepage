<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wald Lab logo - Horizontal lockup
  Background: transparent | viewBox 0 0 310 72 | vector / scalable
  Colors: leaf #1A3828  midrib #2A6347  nodes #82C91E  divider #C8E0D0
          wordmark #1A3828  korean #52A878
  NOTE: outline text before sending to print shop.
-->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 310 72" width="620" height="144"
  fill="none" role="img" aria-label="Wald Lab"
  shape-rendering="geometricPrecision" text-rendering="geometricPrecision">

  <!-- Leaf outline -->
  <path d="M 34,64 C 13,58 7,37 22,14 C 27,6 36,5 39,9 C 47,15 52,37 44,55 C 41,62 38,64 34,64 Z"
    stroke="#1A3828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Midrib -->
  <path d="M 34,62 C 32,50 33,34 37,12"
    stroke="#2A6347" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Node 1 – lower-right vein -->
  <line x1="33" y1="50" x2="43" y2="46" stroke="#82C91E" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="33" cy="50" r="2.6" fill="#82C91E"/>
  <circle cx="43" cy="46" r="1.9" fill="#82C91E"/>
  <!-- Node 2 – middle-left vein -->
  <line x1="33" y1="38" x2="16" y2="35" stroke="#82C91E" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="33" cy="38" r="2.6" fill="#82C91E"/>
  <circle cx="16" cy="35" r="1.9" fill="#82C91E"/>
  <!-- Node 3 – upper-right vein -->
  <line x1="35" y1="26" x2="44" y2="22" stroke="#82C91E" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="35" cy="26" r="2.4" fill="#82C91E"/>
  <circle cx="44" cy="22" r="1.7" fill="#82C91E"/>

  <!-- Divider -->
  <line x1="65" y1="13" x2="65" y2="59"
    stroke="#C8E0D0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="77" y="43" fill="#1A3828"
    font-family="'Manrope','Inter','Helvetica Neue',Arial,sans-serif"
    font-size="28" font-weight="800" letter-spacing="-0.8">Wald Lab</text>
  <!-- Korean subtitle -->
  <text x="79" y="57" fill="#52A878"
    font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
    font-size="10.5" font-weight="400" letter-spacing="3.5">&#xBC1C;&#xD2B8; &#xB7A9;</text>
</svg>
